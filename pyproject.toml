[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mac-traffic-ledger"
version = "0.2.0"
description = "Local-first per-process proxy traffic history for macOS and Mihomo"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "OHHHHHHei"}]
keywords = ["macos", "mihomo", "clash", "traffic", "sqlite"]
classifiers = ["Operating System :: MacOS", "Programming Language :: Python :: 3"]

[project.urls]
Homepage = "https://github.com/OHHHHHHei/mac-traffic-ledger"
Issues = "https://github.com/OHHHHHHei/mac-traffic-ledger/issues"

[project.scripts]
mac-traffic-ledger = "mac_traffic_ledger.ledger:main"
mac-traffic-ledger-service = "mac_traffic_ledger.manage:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mac_traffic_ledger = ["index.html", "style.css", "app.js"]
