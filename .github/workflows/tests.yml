name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -q .
      - run: python -m unittest discover -s tests -v
      - name: Verify packaged dashboard
        run: python -c "from importlib.resources import files; assert all(files('mac_traffic_ledger').joinpath(p).is_file() for p in ['index.html','style.css','app.js'])"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check src/mac_traffic_ledger/app.js
